<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000008">
<title>МедШкалы 103 СМП</title>
<style>
:root {
  --bg: #000008;
  --glass: rgba(255,255,255,0.06);
  --glass-2: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.12);
  --glass-border-2: rgba(255,255,255,0.08);
  --accent: #0a84ff;
  --accent-2: #5e5ce6;
  --emergency: #ff3b30;
  --green: #30d158;
  --yellow: #ffd60a;
  --orange: #ff9f0a;
  --red: #ff453a;
  --purple: #bf5af2;
  --text: rgba(255,255,255,0.95);
  --text-2: rgba(255,255,255,0.60);
  --text-3: rgba(255,255,255,0.30);
  --divider: rgba(255,255,255,0.08);
  --mono: 'SF Mono','Courier New',monospace;
  --sans: -apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
  --radius: 16px;
  --radius-sm: 10px;
  --blur: blur(40px) saturate(180%);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  background:
    radial-gradient(ellipse at 20% 10%, rgba(255,59,48,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 30%, rgba(10,132,255,0.18) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 90%, rgba(94,92,230,0.12) 0%, transparent 50%),
    #000008;
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  min-height: -webkit-fill-available;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
  padding-bottom: calc(80px + var(--safe-bot));
}

/* ===== HEADER ===== */
.hdr {
  padding: calc(var(--safe-top) + 24px) 20px 20px;
  position: sticky;
  top: 0;
  z-index: 10;
  background: linear-gradient(180deg, rgba(0,0,8,0.95) 0%, rgba(0,0,8,0.85) 70%, rgba(0,0,8,0) 100%);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
}

.hdr-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.logo {
  width: 48px; height: 48px;
  position: relative;
  flex-shrink: 0;
  background: linear-gradient(135deg, #ff3b30 0%, #ff6b00 100%);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(255,59,48,0.4), 0 0 0 1px rgba(255,255,255,0.1) inset;
}

.logo-cross {
  position: absolute;
  width: 22px;
  height: 22px;
}
.logo-cross::before, .logo-cross::after {
  content: '';
  position: absolute;
  background: white;
  border-radius: 2px;
}
.logo-cross::before { width: 22px; height: 6px; top: 8px; left: 0; }
.logo-cross::after  { width: 6px; height: 22px; top: 0; left: 8px; }

.logo-103 {
  position: absolute;
  bottom: -4px;
  right: -4px;
  background: #000;
  color: #ff3b30;
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 900;
  padding: 2px 4px;
  border-radius: 4px;
  border: 1px solid #ff3b30;
  letter-spacing: 0.5px;
}

.hdr-title {
  flex: 1;
  min-width: 0;
}

.hdr-name {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: white;
  line-height: 1.1;
}

.hdr-sub {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 2px;
  letter-spacing: 0.02em;
}

.hdr-status {
  font-size: 10px;
  font-weight: 700;
  color: var(--green);
  background: rgba(48,209,88,0.12);
  border: 1px solid rgba(48,209,88,0.3);
  padding: 4px 10px;
  border-radius: 100px;
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}
.hdr-status::before {
  content: '';
  width: 6px; height: 6px;
  background: var(--green);
  border-radius: 50%;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.7); } }

/* Search */
.search-wrap {
  position: relative;
}
.search {
  width: 100%;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  padding: 11px 14px 11px 38px;
  color: white;
  font-family: var(--sans);
  font-size: 14px;
  outline: none;
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
}
.search:focus { border-color: var(--accent); }
.search::placeholder { color: var(--text-3); }
.search-ico {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  color: var(--text-3);
  pointer-events: none;
}

/* ===== WRAP ===== */
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

/* ===== CATEGORY GRID ===== */
.cat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.cat-card {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 18px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.2s;
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  position: relative;
  overflow: hidden;
}
.cat-card:active { transform: scale(0.97); }
.cat-card::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.2s;
  background: radial-gradient(circle at 0% 0%, currentColor 0%, transparent 60%);
  pointer-events: none;
}
.cat-card:hover::before { opacity: 0.08; }

.cat-icon {
  width: 38px; height: 38px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
  font-size: 20px;
  background: currentColor;
  opacity: 0.15;
}
.cat-icon-inner {
  position: absolute;
  font-size: 22px;
}

.cat-title {
  font-size: 14px;
  font-weight: 700;
  color: white;
  line-height: 1.2;
  margin-bottom: 4px;
}
.cat-desc {
  font-size: 11px;
  color: var(--text-3);
  line-height: 1.3;
}
.cat-count {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-3);
  margin-top: 8px;
  font-weight: 600;
}

/* Category colors */
.cat-emergency { color: var(--red); }
.cat-emergency .cat-title { color: var(--red); }
.cat-assess { color: var(--accent); }
.cat-assess .cat-title { color: var(--accent); }
.cat-diag { color: var(--purple); }
.cat-diag .cat-title { color: var(--purple); }
.cat-calc { color: var(--orange); }
.cat-calc .cat-title { color: var(--orange); }
.cat-ref { color: var(--green); }
.cat-ref .cat-title { color: var(--green); }
.cat-peds { color: var(--yellow); }
.cat-peds .cat-title { color: var(--yellow); }

/* ===== SUBCATEGORY LIST ===== */
.sub-back {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 14px;
  cursor: pointer;
  color: var(--text-2);
  font-size: 13px;
  font-weight: 600;
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
}
.sub-back:active { transform: scale(0.98); }

.sub-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 20px;
}

.sub-item {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 14px 16px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 12px;
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
}
.sub-item:active { transform: scale(0.98); }

.sub-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  flex-shrink: 0;
}

.sub-content { flex: 1; min-width: 0; }
.sub-title {
  font-size: 14px;
  font-weight: 600;
  color: white;
  line-height: 1.2;
}
.sub-desc {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 3px;
  line-height: 1.3;
}
.sub-arrow {
  color: var(--text-3);
  font-size: 18px;
  flex-shrink: 0;
}

/* ===== TOOL CARD ===== */
.tool {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 16px;
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  animation: fadeIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.tool-title {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: white;
  margin-bottom: 4px;
}
.tool-sub {
  font-size: 12px;
  color: var(--accent);
  font-family: var(--mono);
  margin-bottom: 8px;
}
.tool-desc {
  font-size: 13px;
  color: var(--text-3);
  line-height: 1.5;
  margin-bottom: 16px;
}

/* Info block */
.info {
  background: rgba(10,132,255,0.06);
  border: 1px solid rgba(10,132,255,0.15);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 16px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.info-ico { font-size: 18px; flex-shrink: 0; line-height: 1.3; }
.info-text { font-size: 12px; color: var(--text-3); line-height: 1.6; }

/* ===== CRITERIA CHECKBOXES ===== */
.crit-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.crit {
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
  -webkit-user-select: none;
}
.crit:active { transform: scale(0.98); }
.crit.on { border-color: var(--accent); background: rgba(10,132,255,0.12); }

.crit-l { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.chk {
  width: 26px; height: 26px;
  border: 2px solid var(--glass-border);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  font-size: 14px;
  color: white;
  font-weight: 900;
}
.crit.on .chk { background: var(--accent); border-color: var(--accent); }
.chk-i { opacity: 0; transition: opacity 0.15s; }
.crit.on .chk-i { opacity: 1; }

.crit-txt { font-size: 14px; font-weight: 600; line-height: 1.35; color: var(--text); }
.crit-hint { font-size: 11px; color: var(--text-3); margin-top: 2px; line-height: 1.3; }

.cbadge {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  background: rgba(10,132,255,0.15);
  border: 1px solid rgba(10,132,255,0.25);
  border-radius: 8px;
  padding: 4px 10px;
  white-space: nowrap;
  flex-shrink: 0;
}

/* ===== INPUTS ===== */
.inp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.inp-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.inp-grp {
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 12px 14px;
  transition: border-color 0.2s;
}
.inp-grp:focus-within { border-color: var(--accent); }
.inp-lbl {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.inp-unit { font-family: var(--mono); font-size: 9px; color: var(--text-3); font-weight: 400; }
.inp-f {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-family: var(--mono);
  font-size: 24px;
  font-weight: 700;
  padding: 0;
}
.inp-f::placeholder { color: rgba(255,255,255,0.1); }
.inp-sc { font-size: 10px; color: var(--text-3); margin-top: 4px; font-family: var(--mono); min-height: 14px; }

/* ===== BUTTONS ===== */
.con-lbl {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 8px;
}
.con-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 16px; }
.con-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 16px; }

.con-btn {
  padding: 11px 8px;
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  background: var(--glass-2);
  color: var(--text-2);
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}
.con-btn:active { transform: scale(0.96); }
.con-btn.on { background: rgba(10,132,255,0.18); border-color: var(--accent); color: var(--accent); font-weight: 600; }

/* ===== RESULT ===== */
.res {
  border-radius: var(--radius);
  padding: 22px 16px;
  text-align: center;
  transition: all 0.35s;
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  position: relative;
  overflow: hidden;
  margin-bottom: 14px;
}
.res::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.35s;
  background: radial-gradient(circle at 50% 0%, currentColor 0%, transparent 70%);
  pointer-events: none;
}
.res.low { border-color: var(--green); }
.res.low::before { color: rgba(48,209,88,0.12); opacity: 1; }
.res.med { border-color: var(--orange); }
.res.med::before { color: rgba(255,159,10,0.12); opacity: 1; }
.res.hi { border-color: var(--red); }
.res.hi::before { color: rgba(255,69,58,0.12); opacity: 1; }

.res-score {
  font-family: var(--mono);
  font-size: 60px;
  font-weight: 700;
  line-height: 1;
  color: var(--text-2);
  transition: color 0.35s;
  position: relative;
}
.res.low .res-score { color: var(--green); }
.res.med .res-score { color: var(--orange); }
.res.hi .res-score { color: var(--red); }

.res-lbl {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-top: 8px;
  margin-bottom: 10px;
  color: var(--text-2);
  position: relative;
}
.res.low .res-lbl { color: var(--green); }
.res.med .res-lbl { color: var(--orange); }
.res.hi .res-lbl { color: var(--red); }

.res-act { font-size: 12px; color: var(--text-3); line-height: 1.55; position: relative; }

/* Interpretation table */
.interp {
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 14px;
}
.interp-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 10px;
}
.interp-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  padding: 6px 0;
  border-bottom: 1px solid var(--divider);
}
.interp-row:last-child { border-bottom: none; }
.interp-range { color: var(--text-3); font-family: var(--mono); }
.interp-val { font-weight: 700; }

/* Reset button */
.reset {
  display: block;
  width: 100%;
  margin-top: 14px;
  padding: 13px;
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  color: var(--text-3);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.reset:active { background: rgba(255,255,255,0.08); color: var(--text); }

/* GCS sections */
.gcs-sec {
  background: rgba(94,92,230,0.08);
  border: 1px solid rgba(94,92,230,0.2);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
}
.gcs-ttl {
  font-size: 11px;
  font-weight: 700;
  color: #a78bfa;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 10px;
}
.gcs-sel {
  width: 100%;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  color: white;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  padding: 10px 12px;
  cursor: pointer;
  outline: none;
  appearance: auto;
}

/* Wells pills */
.w-pills { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
.w-pill { padding: 5px 13px; border-radius: 100px; font-size: 11px; font-weight: 700; font-family: var(--mono); opacity: 0.35; border: 1px solid transparent; transition: all 0.3s; }
.w-pill.on { opacity: 1; }
.w-pill.unlikely { background: rgba(48,209,88,0.1); border-color: var(--green); color: var(--green); }
.w-pill.likely { background: rgba(255,69,58,0.1); border-color: var(--red); color: var(--red); }

/* Slider */
.slider {
  width: 100%;
  height: 4px;
  border-radius: 2px;
  background: rgba(255,255,255,0.12);
  outline: none;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  margin-bottom: 8px;
}
.slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 28px; height: 28px;
  border-radius: 50%;
  cursor: pointer;
  border: 3px solid rgba(0,0,0,0.3);
}
.slider.d::-webkit-slider-thumb { background: var(--yellow); box-shadow: 0 4px 12px rgba(255,214,10,0.4); }
.slider.n::-webkit-slider-thumb { background: var(--red); box-shadow: 0 4px 12px rgba(255,69,58,0.4); }
.slider.novoc::-webkit-slider-thumb { background: var(--purple); box-shadow: 0 4px 12px rgba(191,90,242,0.4); }
.slider.furos::-webkit-slider-thumb { background: var(--green); box-shadow: 0 4px 12px rgba(48,209,88,0.4); }

/* Drug buttons */
.drug-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.drug-btn {
  padding: 14px 10px;
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  background: var(--glass-2);
  color: var(--text-2);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}
.drug-btn:active { transform: scale(0.96); }
.drug-btn .dn { font-size: 14px; color: var(--text); display: block; margin-bottom: 4px; }
.drug-btn .dc { font-size: 10px; font-family: var(--mono); color: var(--text-3); }
.drug-btn.sel-d { border-color: var(--yellow); background: rgba(255,214,10,0.08); }
.drug-btn.sel-d .dn { color: var(--yellow); }
.drug-btn.sel-n { border-color: var(--red); background: rgba(255,69,58,0.08); }
.drug-btn.sel-n .dn { color: var(--red); }
.drug-btn.sel-novoc { border-color: var(--purple); background: rgba(191,90,242,0.08); }
.drug-btn.sel-novoc .dn { color: var(--purple); }
.drug-btn.sel-furos { border-color: var(--green); background: rgba(48,209,88,0.08); }
.drug-btn.sel-furos .dn { color: var(--green); }

.dose-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.dose-lbl { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.07em; }
.dose-val { font-family: var(--mono); font-size: 18px; font-weight: 700; color: white; }
.dose-range { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-3); font-family: var(--mono); }

.w-inp {
  background: var(--glass-2);

  border-radius: var(--radius);

}
.w-inp:focus-within { border-color: var(--accent); }
.w-lbl { font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
.w-field { width: 100%; background: transparent; border: none; outline: none; color: white; font-family: var(--mono); font-size: 28px; font-weight: 700; }
.w-field::placeholder { color: rgba(255,255,255,0.1); }

.inf-res {

.inf-res.d .inf-rate { color: var(--yellow); }

.inf-unit-lbl { font-size: 16px; font-weight: 500; color: var(--text-3); margin-top: 4px; font-family: var(--mono); }

/* Protocol box */

.proto-d { background: rgba(255,214,10,0.06); border: 1px solid rgba(255,214,10,0.25); }

.proto-title.d { color: var(--yellow); }

/* CPR card */

.cpr-mini.rhy { background: rgba(10,132,255,0.06); border: 1px solid rgba(10,132,255,0.3); }
.cpr-mini-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 5px; }
.cpr-mini.epi .cpr-mini-lbl { color: var(--orange); }
.cpr-mini.rhy .cpr-mini-lbl { color: var(--accent); }
.cpr-mini-time { font-family: var(--mono); font-size: 32px; font-weight: 700; color: white; line-height: 1; }
.cpr-mini-sub { font-size: 11px; color: var(--text-3); margin-top: 4px; }

.cpr-btn {

.cpr-btn.epi { background: rgba(255,159,10,0.15); border-color: rgba(255,159,10,0.4); color: var(--orange); }

.cpr-amio {

  font-weight: 700;

  white-space: nowrap;
}

.cpr-log {

  border-radius: 14px;
  padding: 14px;
  margin-bottom: 14px;
}
.cpr-log-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
  max-height: 160px;
  overflow-y: auto;
}
.cpr-log-empty {
  font-size: 12px;
  color: var(--text-3);
  text-align: center;
  padding: 10px;
}

.cpr-ctrl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cpr-start, .cpr-stop {
  padding: 16px;
  border: none;
  border-radius: 14px;
  font-family: var(--sans);
  font-size: 16px;

.cpr-rosc {

/* Reference items */

}
.ref-item-hdr.clickable { cursor: pointer; }
.ref-item-hdr.clickable:active { background: rgba(255,255,255,0.06); }
.ref-item-name { font-size: 11px; font-weight: 700; color: var(--accent); }
.ref-row { padding: 9px 14px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--glass-border-2); }
.ref-row:last-child { border-bottom: none; }
.ref-row-lbl { font-size: 12px; color: var(--text-3); }
.ref-row-val { font-family: var(--mono); font-size: 12px; font-weight: 700; color: white; }
.ref-note { padding: 7px 14px; background: rgba(255,255,255,0.02); font-size: 11px; color: var(--text-3); }
.ref-note.crit { background: rgba(255,69,58,0.05); color: var(--red); }

/* Detail card */
.detail {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 16px;

  -webkit-backdrop-filter: var(--blur);
}
.detail-title { font-size: 16px; font-weight: 700; color: white; margin-bottom: 4px; }

.detail-section { margin-bottom: 14px; }
.detail-section-title {

}
.detail-list { display: flex; flex-direction: column; gap: 5px; }

/* Sticky bottom nav */
.bnav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(0,0,8,0.95);
  backdrop-filter: var(--blur);

  padding: 8px 16px calc(8px + var(--safe-bot));

}
.bnav-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 4px;
  max-width: 560px;
  margin: 0 auto;
}
.bnav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 4px;
  background: transparent;
  border: none;
  color: var(--text-3);
  font-family: var(--sans);

}

.bnav-ico { font-size: 20px; line-height: 1; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-row">
    <div class="logo">
      <div class="logo-cross"></div>
      <div class="logo-103">103</div>
    </div>
    <div class="hdr-title">
      <div class="hdr-name">МедШкалы СМП</div>
      <div class="hdr-sub" id="hdr-sub">Клинический калькулятор · v2.0</div>
    </div>
    <div class="hdr-status">ОНЛАЙН</div>
  </div>
  <div class="search-wrap" id="search-wrap">
    <span class="search-ico">⌕</span>
    <input class="search" id="search" type="text" placeholder="Поиск шкалы или калькулятора...">
  </div>
</div>

<div class="wrap">

<!-- HOME SCREEN -->
<div id="screen-home"></div>

<!-- SUBCATEGORY SCREEN -->
<div id="screen-sub" style="display:none;"></div>

<!-- TOOL SCREEN -->
<div id="screen-tool" style="display:none;"></div>

</div>

<!-- BOTTOM NAV -->
<div class="bnav">
  <div class="bnav-row">
    <button class="bnav-btn active" id="bnav-home" onclick="goHome()">
      <div class="bnav-ico">⌂</div>
      <div>Главная</div>
    </button>
    <button class="bnav-btn" id="bnav-fav" onclick="goCategory('emergency')">
      <div class="bnav-ico">⚡</div>
      <div>Экстренно</div>
    </button>
    <button class="bnav-btn" id="bnav-ped" onclick="goCategory('peds')">
      <div class="bnav-ico">⚕</div>
      <div>Педиатрия</div>
    </button>
    <button class="bnav-btn" id="bnav-ref" onclick="goCategory('ref')">
      <div class="bnav-ico">⚐</div>
      <div>Справочник</div>
    </button>
  </div>
</div>

<script>

// === core.js ===
// ===== АРХИТЕКТУРА ПРИЛОЖЕНИЯ =====
// Каждый инструмент = объект с методами render() и calc()
// Навигация: home → category → tool

// ===== SOUND SYSTEM =====
var sndCtx = null;
function getSnd() {
  if (!sndCtx) { try { sndCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  return sndCtx;
}
function playTone(f, d, v, t) {
  var ctx = getSnd(); if (!ctx) return;
  try {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = t || 'sine'; o.frequency.value = f;
    var n = ctx.currentTime;
    g.gain.setValueAtTime(v || 0.08, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + (d || 0.12));
    o.start(n); o.stop(n + (d || 0.12));
  } catch(e) {}
}
function sndTap() { playTone(520, 0.06, 0.06); }
function sndOn() { playTone(440, 0.08, 0.07); setTimeout(function(){playTone(660,0.12,0.06);},60); }
function sndOff() { playTone(440, 0.08, 0.05); setTimeout(function(){playTone(330,0.10,0.04);},60); }
function sndNav() { playTone(880, 0.08, 0.05); setTimeout(function(){playTone(1100,0.12,0.04);},50); }
function sndReset() { playTone(660,0.07,0.05); setTimeout(function(){playTone(550,0.07,0.05);},80); setTimeout(function(){playTone(440,0.10,0.04);},160); }
function sndWarn() { playTone(440, 0.1, 0.07, 'triangle'); setTimeout(function(){playTone(370,0.15,0.06,'triangle');},120); }

document.addEventListener('touchstart', function init() {
  getSnd(); document.removeEventListener('touchstart', init);
}, {once: true});

// ===== CATEGORIES =====
var CATEGORIES = {
  emergency: {
    title: 'Экстренная помощь',
    desc: 'СЛР, дефибрилляция, инфузомат',
    icon: '⚡',
    color: 'cat-emergency',
    tools: ['cpr','defib','infusomat']
  },
  assess: {
    title: 'Оценка тяжести',
    desc: 'qSOFA, NEWS2, шкалы ком',
    icon: '◉',
    color: 'cat-assess',
    tools: ['qsofa','news2','gcs','rass','shoks','dn']
  },
  diag: {
    title: 'Диагностика',
    desc: 'ТЭЛА, инсульт, ОКС, аппендицит',
    icon: '◈',
    color: 'cat-diag',
    tools: ['wells','cpss','grace','alvarado','algover']
  },
  peds: {
    title: 'Педиатрия',
    desc: 'Дозировки, нормы, реанимация',
    icon: '⚕',
    color: 'cat-peds',
    tools: ['ped_dose','ped_norms','ped_defib','gcs_ped']
  },
  calc: {
    title: 'Расчёты и шкалы',
    desc: 'ИМТ, ИВЛ, FOUR',
    icon: '∑',
    color: 'cat-calc',
    tools: ['bmi','ivl','four']
  },
  ref: {
    title: 'Справочники',
    desc: 'Анализы, растворы, классификации',
    icon: '⚐',
    color: 'cat-ref',
    tools: ['ref_class','ref_labs','ref_infusion']
  }
};

// ===== TOOLS REGISTRY (will be filled by tools-*.js) =====
var TOOLS = {};

// ===== ROUTING =====
var currentScreen = 'home';
var currentCategory = null;
var currentTool = null;

function goHome() {
  sndNav();
  currentScreen = 'home';
  currentCategory = null;
  currentTool = null;
  renderHome();
  updateBnav('home');
  document.getElementById('hdr-sub').textContent = 'Клинический калькулятор · v2.0';
}

function goCategory(catId) {
  sndNav();
  currentScreen = 'category';
  currentCategory = catId;
  currentTool = null;
  renderCategory(catId);
  updateBnav(catId);
  var cat = CATEGORIES[catId];
  if (cat) document.getElementById('hdr-sub').textContent = cat.title;
}

function goTool(toolId) {
  sndNav();
  currentScreen = 'tool';
  currentTool = toolId;
  renderTool(toolId);
  var tool = TOOLS[toolId];
  if (tool) document.getElementById('hdr-sub').textContent = tool.title;
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function updateBnav(active) {
  document.getElementById('bnav-home').classList.toggle('active', active === 'home');
  document.getElementById('bnav-fav').classList.toggle('active', active === 'emergency');
  document.getElementById('bnav-ped').classList.toggle('active', active === 'peds');
  document.getElementById('bnav-ref').classList.toggle('active', active === 'ref');
}

function showScreen(name) {
  document.getElementById('screen-home').style.display = name === 'home' ? 'block' : 'none';
  document.getElementById('screen-sub').style.display = name === 'sub' ? 'block' : 'none';
  document.getElementById('screen-tool').style.display = name === 'tool' ? 'block' : 'none';
}

// ===== RENDER HOME =====
function renderHome() {
  try {
    showScreen('home');
    var html = '<div class="cat-grid">';
    var count = 0;
    for (var key in CATEGORIES) {
      var cat = CATEGORIES[key];
      html += '<div class="cat-card ' + cat.color + '" onclick="goCategory(\'' + key + '\')">';
      html += '<div class="cat-icon">' + cat.icon + '</div>';
      html += '<div class="cat-title">' + cat.title + '</div>';
      html += '<div class="cat-desc">' + cat.desc + '</div>';
      html += '<div class="cat-count">' + cat.tools.length + ' инструментов</div>';
      html += '</div>';
      count++;
    }
    html += '</div>';
    if (count === 0) {
      html = '<div style="padding:20px;color:#ff3b30;font-family:monospace;font-size:12px;">renderHome: CATEGORIES пустые! count=0</div>';
    }
    var el = document.getElementById('screen-home');
    if (!el) {
      document.body.innerHTML = '<div style="padding:20px;color:#ff3b30;">screen-home element not found</div>';
      return;
    }
    el.innerHTML = html;
  } catch(e) {
    var el = document.getElementById('screen-home');
    if (el) {
      el.innerHTML = '<div style="padding:20px;color:#ff3b30;font-family:monospace;font-size:11px;">renderHome ERROR: ' + e.message + '\n' + (e.stack || '') + '</div>';
    }
  }
}

// ===== RENDER CATEGORY =====
function renderCategory(catId) {
  showScreen('sub');
  var cat = CATEGORIES[catId];
  var html = '<div class="sub-back" onclick="goHome()"><span>‹</span><span>Главная</span></div>';
  html += '<h2 style="font-size:24px;font-weight:700;color:white;margin-bottom:4px;letter-spacing:-0.02em;">' + cat.title + '</h2>';
  html += '<p style="font-size:13px;color:var(--text-3);margin-bottom:18px;">' + cat.desc + '</p>';
  html += '<div class="sub-list">';
  for (var i = 0; i < cat.tools.length; i++) {
    var toolId = cat.tools[i];
    var tool = TOOLS[toolId];
    if (!tool) continue;
    html += '<div class="sub-item" onclick="goTool(\'' + toolId + '\')">';
    html += '<div class="sub-icon">' + (tool.abbr || '◉') + '</div>';
    html += '<div class="sub-content">';
    html += '<div class="sub-title">' + tool.title + '</div>';
    html += '<div class="sub-desc">' + (tool.short || '') + '</div>';
    html += '</div>';
    html += '<div class="sub-arrow">›</div>';
    html += '</div>';
  }
  html += '</div>';
  document.getElementById('screen-sub').innerHTML = html;
}

// ===== RENDER TOOL =====
function renderTool(toolId) {
  showScreen('tool');
  var tool = TOOLS[toolId];
  if (!tool) {
    document.getElementById('screen-tool').innerHTML = '<div class="tool"><div class="tool-title">Не найдено</div></div>';
    return;
  }

  var backTarget = currentCategory ? 'goCategory(\'' + currentCategory + '\')' : 'goHome()';
  var backLabel = currentCategory ? CATEGORIES[currentCategory].title : 'Главная';

  var html = '<div class="sub-back" onclick="' + backTarget + '"><span>‹</span><span>' + backLabel + '</span></div>';
  html += '<div class="tool">';
  html += '<div class="tool-title">' + tool.title + '</div>';
  if (tool.subtitle) html += '<div class="tool-sub">' + tool.subtitle + '</div>';
  if (tool.desc) html += '<div class="tool-desc">' + tool.desc + '</div>';
  if (tool.info) {
    html += '<div class="info"><div class="info-ico">ℹ</div><div class="info-text">' + tool.info + '</div></div>';
  }
  html += tool.render();
  html += '</div>';
  document.getElementById('screen-tool').innerHTML = html;

  if (tool.init) tool.init();
}

// ===== SEARCH =====
function attachSearch() {
  var s = document.getElementById('search');
  if (!s) return;
  s.addEventListener('input', function(e) {
  var q = e.target.value.toLowerCase().trim();
  if (!q) {
    if (currentScreen === 'home') renderHome();
    else if (currentScreen === 'category') renderCategory(currentCategory);
    return;
  }
  var matches = [];
  for (var key in TOOLS) {
    var tool = TOOLS[key];
    var searchText = (tool.title + ' ' + (tool.short || '') + ' ' + (tool.abbr || '') + ' ' + (tool.keywords || '')).toLowerCase();
    if (searchText.indexOf(q) !== -1) matches.push(key);
  }
  showScreen('sub');
  var html = '<div class="sub-back" onclick="document.getElementById(\'search\').value=\'\';goHome()"><span>‹</span><span>Очистить поиск</span></div>';
  html += '<h2 style="font-size:18px;font-weight:700;color:white;margin-bottom:12px;">Найдено: ' + matches.length + '</h2>';
  if (matches.length === 0) {
    html += '<div style="color:var(--text-3);font-size:13px;text-align:center;padding:30px;">Ничего не найдено по запросу "' + q + '"</div>';
  } else {
    html += '<div class="sub-list">';
    for (var i = 0; i < matches.length; i++) {
      var tool = TOOLS[matches[i]];
      html += '<div class="sub-item" onclick="document.getElementById(\'search\').value=\'\';goTool(\'' + matches[i] + '\')">';
      html += '<div class="sub-icon">' + (tool.abbr || '◉') + '</div>';
      html += '<div class="sub-content">';
      html += '<div class="sub-title">' + tool.title + '</div>';
      html += '<div class="sub-desc">' + (tool.short || '') + '</div>';
      html += '</div><div class="sub-arrow">›</div></div>';
    }
    html += '</div>';
  }
  document.getElementById('screen-sub').innerHTML = html;
  });
}

    html += '</div>';

    html += '<button class="reset" onclick="TOOLS.wells.reset()">Сбросить</button>';
    return html;
  },

  toggle: function(id, val) {
    var el = document.getElementById('wells-' + id);
    el.classList.toggle('on');
    this.scores[id] = el.classList.contains('on') ? val : 0;
    if (el.classList.contains('on')) sndOn(); else sndOff();
    this.calc();
  },

  calc: function() {
    var t = 0;
    for (var k in this.scores) t += this.scores[k];
    document.getElementById('wells-sc').textContent = t;
    var r = document.getElementById('wells-res');
    var ac = document.getElementById('wells-ac');
    var pu = document.getElementById('wells-pu');
    var pl = document.getElementById('wells-pl');
    if (t <= 4) {
      r.className = 'res low';
      ac.textContent = 'ТЭЛА маловероятна. D-димер высокочувствительный — при отриц. ТЭЛА исключена.';
      pu.classList.add('on'); pl.classList.remove('on');

      pu.classList.remove('on'); pl.classList.add('on');
      sndWarn();
    }

  reset: function() {
    sndReset();
    this.scores = {};
    for (var i = 0; i < this.criteria.length; i++) {
      document.getElementById('wells-' + this.criteria[i].id).classList.remove('on');

    this.calc();
  },

  init: function() { this.scores = {}; this.calc(); }
};

  calc: function() {

    if (this.data.face === 'y') score++;
    if (this.data.arm === 'y') score++;
    if (this.data.speech === 'y') score++;

    document.getElementById('cpss-sc').textContent = score;
    var r = document.getElementById('cpss-res');
    var lb = document.getElementById('cpss-lb');
    var ac = document.getElementById('cpss-ac');

    } else {
      r.className = 'res hi';
      lb.textContent = 'ИНСУЛЬТ (' + (score === 2 ? '85%' : '100%') + ')';
      ac.textContent = 'Срочная транспортировка в сосудистый центр';

      tac.style.background = 'rgba(255,69,58,0.08)';
      tac.style.border = '1px solid rgba(255,69,58,0.25)';
      tac.innerHTML = '<div style="font-size:12px;font-weight:700;color:var(--red);margin-bottom:6px;">Тактика СМП — экстренно!</div>' +
        '<div style="font-size:12px;color:var(--text-2);line-height:1.6;">Срочная транспортировка в первичный сосудистый центр. Положение 30°. Венозный доступ. Глюкоза крови обязательно. АД не снижать если <220/120. Не давать есть/пить.</div>';
      sndWarn();

    // Time window
    var h = parseFloat(document.getElementById('cpss-h').value) || 0;
    var m = parseFloat(document.getElementById('cpss-m').value) || 0;

        timeEl.textContent = 'Окно тромболизиса ОТКРЫТО (' + Math.round(270 - totalMin) + ' мин осталось)';
        timeEl.style.color = 'var(--green)';

        timeEl.textContent = 'Тромболизис закрыт. Возможна тромбэктомия (до 6 ч).';

        timeEl.textContent = 'Более 6 ч. Тромбэктомия возможна до 24 ч при отборе.';
        timeEl.style.color = 'var(--orange)';
      } else {
        timeEl.textContent = 'Более 24 часов от начала симптомов.';
        timeEl.style.color = 'var(--red)';
      }
    } else {
      timeEl.textContent = '';
    }
  },

  reset: function() {

  init: function() { this.data = {face:'n', arm:'n', speech:'n'}; this.calc(); }
};

TOOLS.grace = {

  abbr: 'GR',
  subtitle: 'Global Registry of Acute Coronary Events',
  short: 'Стратификация риска при ОКС. ESC 2020',
  desc: 'Оценка риска смерти в стационаре и через 6 месяцев. GRACE >140 — экстренное ЧКВ.',
  keywords: 'окс инфаркт стенокардия',

  killip: 1,
  flags: {arrest:false, st:false, trop:false},

  scoreAge: function(a) { if(a<30)return 0; if(a<40)return 8; if(a<50)return 25; if(a<60)return 41; if(a<70)return 58; if(a<80)return 75; if(a<90)return 91; return 100; },
  scoreHR: function(h) { if(h<50)return 0; if(h<70)return 3; if(h<90)return 9; if(h<110)return 15; if(h<150)return 24; if(h<200)return 38; return 46; },
  scoreSBP: function(s) { if(s<80)return 58; if(s<100)return 53; if(s<120)return 43; if(s<140)return 34; if(s<160)return 24; if(s<200)return 10; return 0; },
  scoreCr: function(c) { if(isNaN(c))return 7; if(c<35)return 1; if(c<71)return 4; if(c<106)return 7; if(c<141)return 10; if(c<178)return 13; if(c<354)return 21; return 28; },
  scoreKillip: function(k) { return [0,0,20,39,59][k]; },

  render: function() {

    html += '<div class="inp-grp" style="margin-bottom:10px;"><div class="inp-lbl">Возраст <span class="inp-unit">лет</span></div>';
    html += '<input class="inp-f" type="number" id="grace-age" placeholder="65" inputmode="numeric" oninput="TOOLS.grace.calc()"></div>';
    html += '<div class="inp-grid">';
    html += '<div class="inp-grp"><div class="inp-lbl">ЧСС <span class="inp-unit">уд/мин</span></div>';
    html += '<input class="inp-f" type="number" id="grace-hr" placeholder="80" inputmode="numeric" oninput="TOOLS.grace.calc()"></div>';
    html += '<div class="inp-grp"><div class="inp-lbl">АД сист. <span class="inp-unit">мм рт.ст.</span></div>';
    html += '<input class="inp-f" type="number" id="grace-sbp" placeholder="120" inputmode="numeric" oninput="TOOLS.grace.calc()"></div></div>';
    html += '<div class="inp-grp" style="margin-bottom:14px;"><div class="inp-lbl">Креатинин <span class="inp-unit">мкмоль/л (если есть)</span></div>';
    html += '<input class="inp-f" type="number" id="grace-cr" placeholder="—" inputmode="numeric" oninput="TOOLS.grace.calc()" style="font-size:20px;"></div>';

    html += '<div class="con-lbl">Класс Killip</div>';
    html += '<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px;">';
    var killips = [['I', 'Нет признаков СН'], ['II', 'Влажные хрипы в нижних отделах, S3'], ['III', 'Отёк лёгких'], ['IV', 'Кардиогенный шок']];
    for (var i = 0; i < 4; i++) {
      var k = i + 1;
      var cls = k === 1 ? 'con-btn on' : 'con-btn';

      html += '<span style="font-family:var(--mono);font-weight:700;margin-right:8px;">' + killips[i][0] + '</span>' + killips[i][1] + '</button>';
    }
    html += '</div>';

    html += '<div class="con-lbl">Дополнительные факторы</div>';
    html += '<div class="crit-list">';
    var flags = [
      {id:'arrest', t:'Остановка сердца при поступлении', h:'Реанимация на догоспитальном этапе', v:39},
      {id:'st', t:'Отклонение сегмента ST', h:'Депрессия или элевация ST', v:28},
      {id:'trop', t:'Повышение тропонина', h:'Trop I/T выше нормы (если известно)', v:14}
    ];
    for (var i = 0; i < flags.length; i++) {
      var f = flags[i];
      html += '<div class="crit" id="grace-f-' + f.id + '" onclick="TOOLS.grace.toggleF(\'' + f.id + '\')">';
      html += '<div class="crit-l"><div class="chk"><span class="chk-i">✓</span></div>';
      html += '<div><div class="crit-txt">' + f.t + '</div><div class="crit-hint">' + f.h + '</div></div></div>';

    html += '<div class="res-act" id="grace-ac">Введите данные пациента</div></div>';

    html += '<div id="grace-risk" style="display:none;margin-bottom:14px;">';
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">';
    html += '<div style="background:var(--glass-2);border:1px solid var(--glass-border);border-radius:12px;padding:14px;text-align:center;">';

    html += '<div style="font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;margin-bottom:6px;">Через 6 мес</div>';

  setK: function(k) {

  },

  toggleF: function(id) {
    var el = document.getElementById('grace-f-' + id);
    el.classList.toggle('on');
    this.flags[id] = el.classList.contains('on');
    if (el.classList.contains('on')) sndOn(); else sndOff();
    this.calc();
  },

  calc: function() {
    var age = parseFloat(document.getElementById('grace-age').value);
    var hr = parseFloat(document.getElementById('grace-hr').value);
    var sbp = parseFloat(document.getElementById('grace-sbp').value);
    var cr = parseFloat(document.getElementById('grace-cr').value);

    if (isNaN(age) && isNaN(hr) && isNaN(sbp)) {
      document.getElementById('grace-sc').textContent = '—';
      document.getElementById('grace-ac').textContent = 'Введите данные пациента';
      document.getElementById('grace-res').className = 'res';
      document.getElementById('grace-risk').style.display = 'none';
      return;
    }

    var score = 0;
    if (!isNaN(age)) score += this.scoreAge(age);
    if (!isNaN(hr)) score += this.scoreHR(hr);
    if (!isNaN(sbp)) score += this.scoreSBP(sbp);
    score += this.scoreCr(cr);
    score += this.scoreKillip(this.killip);
    if (this.flags.arrest) score += 39;
    if (this.flags.st) score += 28;
    if (this.flags.trop) score += 14;

    document.getElementById('grace-sc').textContent = score;

    var hospCat, hospPct, hospCol, sixCat, sixPct, sixCol, cls, tactic, tacticCol, tacticBrd, tacticTxt;
    if (score <= 108) {
      hospCat = 'Низкий'; hospPct = '<1%'; hospCol = 'var(--green)';
      cls = 'low'; tactic = 'Низкий риск. Плановая инвазивная стратегия (>72 ч). Возможна консервативная тактика.';
      tacticCol = 'rgba(48,209,88,0.08)'; tacticBrd = 'rgba(48,209,88,0.2)'; tacticTxt = 'var(--green)';
    } else if (score <= 140) {
      hospCat = 'Средний'; hospPct = '1-3%'; hospCol = 'var(--orange)';
      cls = 'med'; tactic = 'Средний риск. Ранняя инвазивная стратегия (в течение 72 ч). Кардиология.';
      tacticCol = 'rgba(255,159,10,0.08)'; tacticBrd = 'rgba(255,159,10,0.2)'; tacticTxt = 'var(--orange)';
    } else {
      hospCat = 'Высокий'; hospPct = '>3%'; hospCol = 'var(--red)';
      cls = 'hi'; tactic = 'Высокий риск. Экстренная инвазивная стратегия (<2 ч). Срочная транспортировка в РСЦ с ЧКВ!';
      tacticCol = 'rgba(255,69,58,0.08)'; tacticBrd = 'rgba(255,69,58,0.3)'; tacticTxt = 'var(--red)';
    }
    if (score <= 88) { sixCat = 'Низкий'; sixPct = '<3%'; sixCol = 'var(--green)'; }
    else if (score <= 118) { sixCat = 'Средний'; sixPct = '3-8%'; sixCol = 'var(--orange)'; }
    else { sixCat = 'Высокий'; sixPct = '>8%'; sixCol = 'var(--red)'; }

    document.getElementById('grace-res').className = 'res ' + cls;
    document.getElementById('grace-ac').textContent = 'Риск в стационаре: ' + hospPct + ' (' + hospCat + ')';
    document.getElementById('grace-risk').style.display = 'block';
    document.getElementById('grace-h-pct').textContent = hospPct;
    document.getElementById('grace-h-pct').style.color = hospCol;
    document.getElementById('grace-h-cat').textContent = hospCat + ' риск';
    document.getElementById('grace-s-pct').textContent = sixPct;
    document.getElementById('grace-s-pct').style.color = sixCol;
    document.getElementById('grace-s-cat').textContent = sixCat + ' риск';
    var tac = document.getElementById('grace-tactic');
    tac.style.background = tacticCol;
    tac.style.border = '1px solid ' + tacticBrd;
    tac.innerHTML = '<div style="font-weight:700;color:' + tacticTxt + ';margin-bottom:4px;">Тактика</div>' +
      '<div style="color:var(--text-2);font-size:12px;line-height:1.5;">' + tactic + '</div>';
  },

  reset: function() {
    sndReset();
    ['age','hr','sbp','cr'].forEach(function(id) { document.getElementById('grace-' + id).value = ''; });

    for (var i = 1; i <= 4; i++) document.getElementById('grace-k-' + i).classList.toggle('on', i === 1);
    this.flags = {arrest:false, st:false, trop:false};
    ['arrest','st','trop'].forEach(function(id) { document.getElementById('grace-f-' + id).classList.remove('on'); });
