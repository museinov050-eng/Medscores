<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МедШкалы СМП</title>

<style>
body{background:#000;color:#fff;font-family:sans-serif;padding:20px}
.tab{padding:10px 15px;margin:5px;border-radius:10px;border:1px solid #333;cursor:pointer}
.tab.act{background:#0a84ff}
.card{display:none;margin-top:20px;padding:15px;border:1px solid #333;border-radius:10px}
.card.show{display:block}
.crit{padding:10px;border:1px solid #333;margin:5px 0;border-radius:10px;cursor:pointer}
.crit.on{background:#0a84ff}
.res{margin-top:15px;font-size:20px}
</style>
</head>

<body>

<h2>МедШкалы СМП</h2>

<div>
<button class="tab act" onclick="openTab('qs', this)">qSOFA</button>
<button class="tab" onclick="openTab('gcs', this)">GCS</button>
<button class="tab" onclick="openTab('bmi', this)">ИМТ</button>
<button class="tab" onclick="openTab('shock', this)">Альговер</button>
</div>

<!-- qSOFA -->
<div class="card show" id="qs">
<h3>qSOFA</h3>

<div class="crit" onclick="toggleCrit(this, 'rr')">ЧДД ≥22</div>
<div class="crit" onclick="toggleCrit(this, 'sb')">АД ≤100</div>
<div class="crit" onclick="toggleCrit(this, 'gc')">Сознание нарушено</div>

<div class="res">Баллы: <span id="qsScore">0</span></div>
<div id="qsText">Низкий риск</div>
</div>

<!-- GCS -->
<div class="card" id="gcs">
<h3>GCS</h3>

<select id="gE" onchange="calcGCS()">
<option value="4">E4</option>
<option value="3">E3</option>
<option value="2">E2</option>
<option value="1">E1</option>
</select>

<select id="gV" onchange="calcGCS()">
<option value="5">V5</option>
<option value="4">V4</option>
<option value="3">V3</option>
<option value="2">V2</option>
<option value="1">V1</option>
</select>

<select id="gM" onchange="calcGCS()">
<option value="6">M6</option>
<option value="5">M5</option>
<option value="4">M4</option>
<option value="3">M3</option>
<option value="2">M2</option>
<option value="1">M1</option>
</select>

<div class="res">Итого: <span id="gcsScore">15</span></div>
</div>

<!-- BMI -->
<div class="card" id="bmi">
<h3>ИМТ</h3>

<input id="height" placeholder="Рост см"><br><br>
<input id="weight" placeholder="Вес кг"><br><br>

<button onclick="calcBMI()">Рассчитать</button>

<div class="res">ИМТ: <span id="bmiRes">—</span></div>
<div id="bmiText"></div>
</div>

<!-- Shock -->
<div class="card" id="shock">
<h3>Индекс Альговера</h3>

<input id="hr" placeholder="ЧСС"><br><br>
<input id="sbp" placeholder="САД"><br><br>

<button onclick="calcShock()">Рассчитать</button>

<div class="res">Индекс: <span id="shockRes">—</span></div>
<div id="shockText"></div>
</div>

<script>

// ================== ВКЛАДКИ ==================
function openTab(id, el){
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('show'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('act'));

  document.getElementById(id).classList.add('show');
  el.classList.add('act');
}

// ================== qSOFA ==================
let qs = {rr:0, sb:0, gc:0};

function toggleCrit(el, key){
  el.classList.toggle('on');
  qs[key] = el.classList.contains('on') ? 1 : 0;

  let sum = qs.rr + qs.sb + qs.gc;

  qsScore.innerText = sum;

  if(sum >= 2) qsText.innerText = "Высокий риск";
  else if(sum === 1) qsText.innerText = "Средний риск";
  else qsText.innerText = "Низкий риск";
}

// ================== GCS ==================
function calcGCS(){
  let sum =
    +gE.value +
    +gV.value +
    +gM.value;

  gcsScore.innerText = sum;
}

// ================== BMI ==================
function calcBMI(){
  let h = height.value / 100;
  let w = weight.value;

  if(!h || !w) return;

  let bmi = (w/(h*h)).toFixed(1);
  bmiRes.innerText = bmi;

  if(bmi < 18.5) bmiText.innerText = "Дефицит";
  else if(bmi < 25) bmiText.innerText = "Норма";
  else if(bmi < 30) bmiText.innerText = "Избыточный вес";
  else bmiText.innerText = "Ожирение";
}

// ================== SHOCK ==================
function calcShock(){
  let h = hr.value;
  let s = sbp.value;

  if(!h || !s) return;

  let i = (h/s).toFixed(2);
  shockRes.innerText = i;

  if(i > 1) shockText.innerText = "Шок";
  else if(i > 0.7) shockText.innerText = "Риск";
  else shockText.innerText = "Норма";
}

</script>

</body>
</html>
